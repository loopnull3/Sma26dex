# Sma26dex 기본 DXVK 설정 (DXVK_CONFIG_FILE 로 지정됨)
# 입력 지연 최소화
dxgi.maxFrameLatency = 1
d3d9.maxFrameLatency = 1

# 셰이더 컴파일 스레드: 0 = 자동(모든 코어)
dxvk.numCompilerThreads = 0

# 모바일 GPU 를 거부하는 게임용 벤더 ID 위장 (필요할 때만 주석 해제)
# 1002 = AMD. NVIDIA(10de)는 NVAPI 경로를 타므로 권장하지 않음.
# dxgi.customVendorId = 1002
# d3d9.customVendorId = 1002

# 프레임 제한은 s26dex run --fps N (DXVK_FRAME_RATE) 사용 권장
